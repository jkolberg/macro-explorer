[project]
name = "macro-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyodbc>=5.3.0",
    "pypyr>=5.9.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.50",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
]
